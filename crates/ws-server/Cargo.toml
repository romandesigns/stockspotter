[package]
name = "ws-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true, features = ["fs"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true
chrono.workspace = true
axum.workspace = true
tower-http.workspace = true
reqwest.workspace = true
market-data = { path = "../market-data" }
replay-engine = { path = "../replay-engine" }
backtest-metrics = { path = "../backtest-metrics" }
auto-trader = { path = "../auto-trader" }
# Already in Cargo.lock at 0.10.9 (a dependency of the WebSocket stack); now
# direct so a preregistration can be identified by SHA-256 in-process. RustCrypto,
# MIT/Apache-2.0. No new crate or version enters the lockfile.
sha2 = "0.10.9"
# Offline evaluator only (`offline-eval`): reads archived (gzip) observer runs.
# rust-lang/flate2-rs, MIT/Apache-2.0. Optional, so the production build neither
# compiles nor links it. With `offline-eval` on, flate2's default features
# select its `rust_backend`, so what is compiled is flate2, miniz_oxide (pure
# Rust, with adler2 and simd-adler32) and crc32fast. `zlib-rs` also appears in
# Cargo.lock, but only because it is an optional dependency of flate2 that the
# lockfile records: no feature enabled here selects it and it is not compiled
# (`cargo tree --features offline-eval -i zlib-rs` prints nothing).
flate2 = { version = "1.1", optional = true }

[features]
# Phase timers on the observer hot path (Step 4B-perf profiling only). Off in
# every normal and benchmark build, so the frozen benchmark measures the
# uninstrumented code.
obs-profile = []
# Step-4 offline evaluator (`ws-server step4-eval ...`): reads archived observer
# runs off production. Not a default feature. No build step in this repository
# (workflows, Dockerfiles, deploy scripts) enables it; only the CI test step does.
offline-eval = ["dep:flate2"]
