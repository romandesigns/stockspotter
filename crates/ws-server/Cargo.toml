[package]
name = "ws-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true, features = ["fs"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true
chrono.workspace = true
axum.workspace = true
tower-http.workspace = true
reqwest.workspace = true
market-data = { path = "../market-data" }
replay-engine = { path = "../replay-engine" }
backtest-metrics = { path = "../backtest-metrics" }
auto-trader = { path = "../auto-trader" }
# Already in Cargo.lock at 0.10.9 (a dependency of the WebSocket stack); now
# direct so a preregistration can be identified by SHA-256 in-process. RustCrypto,
# MIT/Apache-2.0. No new crate or version enters the lockfile.
sha2 = "0.10.9"
# Offline evaluator only (`offline-eval`): reads archived (gzip) observer runs.
# rust-lang/flate2-rs, MIT/Apache-2.0, pure-Rust miniz_oxide backend. Optional,
# so the production build neither compiles nor links it.
flate2 = { version = "1.1", optional = true }

[features]
# Phase timers on the observer hot path (Step 4B-perf profiling only). Off in
# every normal and benchmark build, so the frozen benchmark measures the
# uninstrumented code.
obs-profile = []
# Step-4 offline evaluator (`ws-server step4-eval ...`). Topic-branch tooling
# that runs off production; never enabled in any deployed build.
offline-eval = ["dep:flate2"]
