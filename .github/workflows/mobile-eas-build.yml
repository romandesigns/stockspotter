name: Mobile EAS production build

# Queues Android and iOS production builds on EAS for the dispatched master
# commit. Explicit only: dispatched by hand from master. It is NOT a
# consequence of merging.
#
# Until 2026-10-08 this ran on `workflow_run` after every successful Validate
# push to master and built whenever the tip commit touched mobile inputs, so
# merging a mobile, shared-types or lockfile change queued a production build
# for both platforms. That path also judged "affected" from HEAD^1..HEAD,
# which sees only the last commit of a rebase merge.
#
# The full Validate workflow, including the mobile advisory gate, still has
# to pass first: it is called below for the exact dispatched commit, and on a
# dispatch its mobile job always runs (validate.yml treats workflow_dispatch
# as mobile-affected), so "skipped" can never stand in for "passed" here.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  build:
    needs: validate
    # A dispatch runs the dispatched branch's copy of this file, so this ref
    # check stops accidents from master's copy, not a deliberate dispatch of
    # another branch's workflow. No GitHub environment is referenced because
    # none is configured for this repository.
    if: github.ref == 'refs/heads/master'
    concurrency:
      group: mobile-eas-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require Expo build credential
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: test -n "$EXPO_TOKEN" || { echo 'EXPO_TOKEN repository secret is required for EAS builds' >&2; exit 1; }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Queue and verify production Android and iOS builds
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bun x eas-cli@latest build --platform all --profile production --non-interactive
