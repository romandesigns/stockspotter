name: Desktop Release

# Verifies Windows packages on pushes and default manual runs. Publishing
# requires a manual run with publish=true after human release approval.
# Publication regenerates latest.json so
# tauri-plugin-updater (wired in apps/client/src-tauri) picks it up on
# existing installs. Windows-only for now — macOS/Linux are deferred
# (see docs/... client architecture notes).

on:
  push:
    branches: [master]
    paths:
      - "apps/client/**"
      - "packages/shared-types/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish after final human approval (otherwise verify only)"
        type: boolean
        required: true
        default: false

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  verify:
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri -> target

      # Bun workspace install from the repo root, so @stockspotter/shared-types
      # links into apps/client the same way it does locally.
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Verify Windows installers without publication
        working-directory: apps/client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --ci -- --locked

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-verified-${{ github.sha }}
          path: apps/client/src-tauri/target/release/bundle/
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri -> target
      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing keypair — generated locally via `tauri signer generate`,
          # private key never committed (see apps/client/src-tauri/.gitignore).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/client
          args: --ci -- --locked
          tagName: desktop-v__VERSION__
          releaseName: "Stockspotter Desktop v__VERSION__"
          releaseBody: |
            Automated build from ${{ github.sha }}.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
