name: Desktop Release

# Validates the desktop/server surface on every master push and pull request
# that touches the client, and -- ONLY when explicitly dispatched from master
# with `publish` ticked -- builds and signs the Windows installer and creates
# a DRAFT GitHub Release.
# Windows-only for now — macOS/Linux are deferred (see docs/... client
# architecture notes).
#
# Publishing is deliberately NOT a consequence of merging. Until 2026-10-08 a
# push to master touching the paths below ran the release job directly, and
# because tauri.conf.json's version rarely changes in the same commit,
# tauri-action found the already-published release for that tag and replaced
# its installers and latest.json in place ("Deleting existing ..." in the
# 2026-09-04 run logs for 0.6.1, 0.7.0 and 0.8.0). The tag kept pointing at
# the old commit while the binaries under it came from a newer one. The
# guard step below refuses to reuse a tag or release for that reason.
#
# The release is created as a draft: a draft is not served by
# releases/latest/download/latest.json (the updater endpoint in
# tauri.conf.json), so nothing reaches an installed client until the draft
# is published by hand.
#
# `desktop-audit` runs with the validation half, i.e. on the same pushes and
# pull requests, and the release job cannot start without it: the desktop
# shell has its own Cargo.lock that no other audit in this repository reads.

on:
  push:
    branches: [master]
    paths:
      - "apps/client/**"
      - "packages/shared-types/**"
      - "bun.lock"
      - "package.json"
  pull_request:
    paths:
      - "apps/client/**"
      - "packages/shared-types/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/desktop-release.yml"
      - ".github/workflows/validate-server.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Build, sign and create a DRAFT release for the version in tauri.conf.json (master only). Unticked = validate only."
        type: boolean
        default: false

jobs:
  validate:
    # Desktop installs only the client/server workspace surface. Mobile's
    # Expo/Metro advisories are separately gated by Validate and must not
    # prevent a desktop build whose install surface excludes those packages.
    uses: ./.github/workflows/validate-server.yml

  # RustSec audit of the desktop shell's OWN lockfile.
  #
  # apps/client/src-tauri is not a member of the root Cargo workspace and has
  # its own Cargo.lock (489 crates), so the `cargo audit` in the validation
  # workflows -- which reads the root Cargo.lock -- never sees a crate that
  # ships in the installer. That is how rustls 0.23.43 (RUSTSEC-2026-0285,
  # reached through reqwest and tauri-plugin-updater, i.e. the update check
  # itself) sat in the desktop build unnoticed.
  #
  # No `if:` on purpose: it runs for every trigger of this workflow, so a pull
  # request touching apps/client/** is told about a vulnerable desktop
  # lockfile at review time, not on release day. `release` needs it, so a
  # failure here leaves the release job skipped.
  #
  # It lives here, not in validate.yml or validate-server.yml, on purpose.
  # ops/vps/deploy_guard.py refuses a Validate run containing a job it does
  # not classify, so a new job there would stop every server deploy until the
  # guard changed too; and folding it into `Dependency advisories` would let
  # a desktop-only crate advisory block server releases -- the cross-surface
  # coupling the mobile split removed. Its name is deliberately not one of
  # the required check names.
  #
  # cargo-audit's default severity policy, NOT `--deny warnings`: a
  # vulnerability fails the job, while unmaintained/unsound/yanked notices
  # are printed without failing it. This lockfile carries seven such notices
  # inherited through Tauri's own dependency tree (six unmaintained: the
  # unic-* crates and proc-macro-error; one unsound: glib). This change does
  # not address them, and denying them here would block every desktop release
  # until they are. Nothing is ignored or allowlisted -- there is no
  # `--ignore` and no audit.toml -- so every notice stays visible in the log
  # and any vulnerability fails. The root-workspace audit keeps its stricter
  # `--deny warnings`.
  desktop-audit:
    name: Desktop shell advisories (RustSec)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Same pin as the `Dependency advisories` job, for the same reason: a
      # cargo-audit release must not change CI behaviour on its own. The
      # advisory database is deliberately not pinned.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Rust advisories (desktop shell lockfile)
        run: cargo audit --file apps/client/src-tauri/Cargo.lock

  release:
    needs: [validate, desktop-audit]
    # A dispatch runs the workflow file of the branch it is dispatched on, so
    # this ref check is only as strong as that branch's copy of this file: it
    # stops accidents from master's copy, not a deliberate dispatch of another
    # branch's workflow. No GitHub environment is referenced here because none
    # is configured for this repository; an unconfigured environment name
    # would look like an approval gate without being one. Moving the signing
    # key into a protected environment is a separate owner decision.
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master'
    # Job-level, not workflow-level: a running release job must not
    # hold a concurrency group that pull-request validation runs also queue
    # in (the old workflow-level `desktop-release` group cancelled pending PR
    # runs: 37727079988 and 37728182510 on 2026-10-08).
    concurrency:
      group: desktop-release-publish
      cancel-in-progress: false
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Fail closed before anything is built or signed. tauri-action matches
      # an existing release by tag name -- drafts included, and a draft has no
      # git tag -- and overwrites its assets, so both the tag ref and the
      # release list are checked. An unreachable remote or API is a refusal,
      # not a pass.
      - name: Refuse to reuse an existing tag or release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python -c "import json; print(json.load(open('apps/client/src-tauri/tauri.conf.json', encoding='utf-8'))['version'])" | tr -d '\r')"
          case "$version" in
            ''|null|*[!0-9A-Za-z.+-]*) echo "::error::unusable version in tauri.conf.json: '$version'"; exit 1 ;;
          esac
          tag="desktop-v${version}"
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null
          rc=$?
          set -e
          case "$rc" in
            2) ;;
            0) echo "::error::tag ${tag} already exists; bump the version in apps/client/src-tauri/tauri.conf.json"; exit 1 ;;
            *) echo "::error::could not verify that tag ${tag} is unused (git ls-remote exit ${rc})"; exit 1 ;;
          esac
          existing="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq ".[] | select(.tag_name == \"${tag}\") | \"\(.id) draft=\(.draft)\"")"
          if [ -n "$existing" ]; then
            echo "::error::a release for ${tag} already exists (${existing}); delete the draft or bump the version"
            exit 1
          fi
          echo "OK: ${tag} is unused; building ${GITHUB_SHA}"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri -> target

      # Keep this install on the desktop/web surface; do not install the
      # Expo/Metro mobile toolchain into a desktop release builder.
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile --filter '@stockspotter/client' --filter '@stockspotter/shared-types'

      # tauri-action runs the client's `tsc -b && vite build`, and `tsc -b`
      # type-checks the client's tests. attentionParity.test.ts imports
      # apps/mobile/src, which imports @stockspotter/shared-types. A full
      # install links that package under apps/mobile/node_modules; the
      # filtered install above deliberately does not install mobile, so
      # without this step the build dies before compiling anything:
      #
      #   ../mobile/src/derive.ts: error TS2307: Cannot find module
      #   '@stockspotter/shared-types'
      #
      # The `run:` line is byte-for-byte the one in the `Tests, lint and
      # build` job of validate.yml and validate-server.yml (and the web image
      # builder makes the same link), so the tree that is released is the
      # tree CI type-checked; ops/ci/test_js_advisory_gate.py fails if the
      # three drift apart. It links our own workspace package -- nothing
      # from the registry.
      #
      # Two things differ from those Linux jobs and both are needed here:
      # `shell: bash`, because the default shell on a Windows runner is
      # PowerShell, where `mkdir -p` and `ln` mean something else; and
      # MSYS=winsymlinks:nativestrict, because Git Bash's `ln -s` otherwise
      # silently makes a deep COPY of the directory. A copy happens to
      # type-check today, but it is a second set of files that TypeScript
      # treats as a different module from the one the client imports. With
      # nativestrict the step creates a real symlink or fails -- before
      # anything is built or signed.
      - name: Link shared-types for the mobile source the client tests import
        shell: bash
        env:
          MSYS: winsymlinks:nativestrict
        run: mkdir -p apps/mobile/node_modules/@stockspotter && ln -s ../../../../packages/shared-types apps/mobile/node_modules/@stockspotter/shared-types

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing keypair — generated locally via `tauri signer generate`,
          # private key never committed (see apps/client/src-tauri/.gitignore).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/client
          tagName: desktop-v__VERSION__
          releaseName: "Stockspotter Desktop v__VERSION__"
          releaseBody: |
            Automated build from ${{ github.sha }}.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
