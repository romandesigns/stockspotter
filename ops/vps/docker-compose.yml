# VPS deploy (srv1170872, native systemd Caddy -- NOT caddy-docker-proxy
# like the Pi fleet's root docker-compose.yml, which this deliberately
# does NOT reuse: that one's caddy=/caddy_0=/caddy_1= labels only mean
# anything to caddy-docker-proxy, which isn't what's running here). No
# caddy labels at all -- the VPS's own native Caddy reverse-proxies to
# these containers by port over 127.0.0.1, configured directly in
# /etc/caddy/Caddyfile (see ops/vps/Caddyfile.snippet and README.md),
# not via Docker labels.
#
# context: ../.. (not .) -- this file lives at ops/vps/docker-compose.yml,
# two directories below the repo root the build actually needs (same
# reasoning as apps/client/Dockerfile's own comment: the whole Bun
# workspace has to be in the build context for @stockspotter/shared-types
# to resolve). Compose resolves build.context relative to THIS file's own
# directory by default, not the invocation directory.
#
# Ports bound to 127.0.0.1 only, not 0.0.0.0 -- this VPS has a real
# public IP (unlike the Pi, reachable only over the tailnet), so nothing
# should be reachable except through Caddy's own TLS-terminated proxy.
#
# Log rotation (2026-09-25). Every service used to run with Docker's
# json-file default -- no max-size -- and this host has no
# /etc/docker/daemon.json, so the ws log grew without bound: 7.1 GB after
# five days, ~1.1-1.8 GB per trading day, on a disk that was 97% full.
# Rotation is set HERE, per service, rather than in the daemon config on
# purpose: the daemon is shared with other tenants (Convex, axonar,
# scout-ntfy) whose logging is not ours to change, and a daemon default
# only applies to containers created after a dockerd restart anyway.
#
# Sizing. ws keeps 8 x 256 MiB = 2 GiB, which holds at least one full
# trading day at the observed rate -- enough to diagnose "what happened
# during yesterday's session" from `docker logs`, which is the question
# these logs actually get asked. The other services log a few MB a day, so
# 4 x 50 MiB is generous. json-file (not `local`) keeps `docker logs`
# output and on-disk format identical to what every existing runbook and
# grep here assumes.
#
# Activation: logging options are part of a container's create-time
# config, so they take effect only when a container is RECREATED from a
# checkout that contains this file -- i.e. the next full deploy.sh run
# after /opt/apps/stockspotter itself advances to such a commit. The
# web-only path (deploy-chart-web.sh) does NOT activate it: that script
# runs compose from the production checkout, which it requires to still be
# at the frozen $BASE, and its release-surface guard refuses ops/ changes.
# Nothing changes for running containers, and the existing 7.1 GB ws log
# is released only when that container is recreated.
x-logging-ws: &logging-ws
  driver: json-file
  options:
    max-size: "256m"
    max-file: "8"

x-logging-default: &logging-default
  driver: json-file
  options:
    max-size: "50m"
    max-file: "4"

services:
  web:
    build:
      context: ../..
      dockerfile: apps/client/Dockerfile
    restart: unless-stopped
    logging: *logging-default
    ports:
      - "127.0.0.1:3000:3000"

  ws:
    build:
      context: ../..
      dockerfile: crates/ws-server/Dockerfile
      args:
        # Build-time commit identity. `deploy.sh` exports this from
        # `git rev-parse HEAD` for the checkout being deployed; an empty value
        # means the binary cannot prove its identity, which the completeness
        # checker reports as INDETERMINATE rather than silently accepting.
        STOCKSPOTTER_COMMIT: "${STOCKSPOTTER_COMMIT:-}"
    restart: unless-stopped
    logging: *logging-ws
    env_file:
      - ../../.env
    environment:
      - WS_SERVER_ADDR=0.0.0.0:8787
      - HTTP_SERVER_ADDR=0.0.0.0:8788
      - QUALIFY_SERVICE_URL=http://qualify:8000
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"
    # See the root docker-compose.yml's own comment on this same mount --
    # the live detection-efficiency benchmark's JSONL logs need to
    # survive a redeploy, not live on the container's ephemeral fs.
    volumes:
      - ../../data:/app/data
    depends_on:
      - qualify

  # Python qualitative layer (python/app) -- doc section 4.4's news
  # catalyst tagging. No published port at all (not even loopback-only) --
  # `ws` is its only caller, reached by service name over this compose
  # project's own default network. Same ALPACA_* credentials as `ws`, from
  # the same .env already on this box -- no separate secret to create.
  qualify:
    build:
      context: ../..
      dockerfile: python/Dockerfile
    restart: unless-stopped
    logging: *logging-default
    env_file:
      - ../../.env

  # Dry-run paper-trading journal for Micropullback signals (2026-09-03,
  # Roman's own "auto-trader agent" ask). Connects to `ws` as a real WS
  # client (same handshake apps/client/apps/mobile use), same as `qualify`
  # reaching `ws` by service-name DNS on this compose network -- no
  # published port, nothing outside this network needs to reach it.
  # Defaults to the local journal. Set AUTO_TRADER_EXECUTION_MODE=paper in
  # the shared .env to use broker-confirmed Alpaca paper orders and status.
  # Paper mode only accepts https://paper-api.alpaca.markets; it cannot trade live.
  # Shares the same data/ mount as `ws` so its JSONL journal
  # (data/auto_trader_journal.jsonl) survives a redeploy.
  auto-trader:
    env_file:
      - ../../.env
    build:
      context: ../..
      dockerfile: crates/auto-trader/Dockerfile
    restart: unless-stopped
    logging: *logging-default
    environment:
      - AUTO_TRADER_WS_URL=ws://ws:8787
    volumes:
      - ../../data:/app/data
    depends_on:
      - ws

  # Read-only daily evaluation; this service cannot submit broker orders.
  discovery-review:
    build:
      context: ../..
      dockerfile: python/Dockerfile
    restart: unless-stopped
    logging: *logging-default
    env_file:
      - ../../.env
    command: ["python", "/app/discovery_review.py"]
    volumes:
      - ../../data:/app/data
    depends_on:
      - ws
      - auto-trader
