# VPS deploy (srv1170872, native systemd Caddy -- NOT caddy-docker-proxy
# like the Pi fleet's root docker-compose.yml, which this deliberately
# does NOT reuse: that one's caddy=/caddy_0=/caddy_1= labels only mean
# anything to caddy-docker-proxy, which isn't what's running here). No
# caddy labels at all -- the VPS's own native Caddy reverse-proxies to
# these containers by port over 127.0.0.1, configured directly in
# /etc/caddy/Caddyfile (see ops/vps/Caddyfile.snippet and README.md),
# not via Docker labels.
#
# context: ../.. (not .) -- this file lives at ops/vps/docker-compose.yml,
# two directories below the repo root the build actually needs (same
# reasoning as apps/client/Dockerfile's own comment: the whole Bun
# workspace has to be in the build context for @stockspotter/shared-types
# to resolve). Compose resolves build.context relative to THIS file's own
# directory by default, not the invocation directory.
#
# Ports bound to 127.0.0.1 only, not 0.0.0.0 -- this VPS has a real
# public IP (unlike the Pi, reachable only over the tailnet), so nothing
# should be reachable except through Caddy's own TLS-terminated proxy.
services:
  web:
    build:
      context: ../..
      dockerfile: apps/client/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"

  ws:
    build:
      context: ../..
      dockerfile: crates/ws-server/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - WS_SERVER_ADDR=0.0.0.0:8787
      - HTTP_SERVER_ADDR=0.0.0.0:8788
      - QUALIFY_SERVICE_URL=http://qualify:8000
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"
    # See the root docker-compose.yml's own comment on this same mount --
    # the live detection-efficiency benchmark's JSONL logs need to
    # survive a redeploy, not live on the container's ephemeral fs.
    volumes:
      - ../../data:/app/data
    depends_on:
      - qualify

  # Python qualitative layer (python/app) -- doc section 4.4's news
  # catalyst tagging. No published port at all (not even loopback-only) --
  # `ws` is its only caller, reached by service name over this compose
  # project's own default network. Same ALPACA_* credentials as `ws`, from
  # the same .env already on this box -- no separate secret to create.
  qualify:
    build:
      context: ../..
      dockerfile: python/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env

  # Dry-run paper-trading journal for Micropullback signals (2026-09-03,
  # Roman's own "auto-trader agent" ask). Connects to `ws` as a real WS
  # client (same handshake apps/client/apps/mobile use), same as `qualify`
  # reaching `ws` by service-name DNS on this compose network -- no
  # published port, nothing outside this network needs to reach it.
  # Places NO real Alpaca orders (no ALPACA_* credentials needed here at
  # all -- see crates/auto-trader/src/config.rs's own doc comment); every
  # tunable has a safe default, so this needs zero required vars in .env.
  # Shares the same data/ mount as `ws` so its JSONL journal
  # (data/auto_trader_journal.jsonl) survives a redeploy.
  auto-trader:
    build:
      context: ../..
      dockerfile: crates/auto-trader/Dockerfile
    restart: unless-stopped
    environment:
      - AUTO_TRADER_WS_URL=ws://ws:8787
    volumes:
      - ../../data:/app/data
    depends_on:
      - ws
