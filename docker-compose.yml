# Deployed on the Pi by deploy.sh (see stockspotter-deploy.timer). Joins the
# shared `proxy` network from the wavystack stack so caddy-docker-proxy
# auto-routes it — no manual Caddyfile editing.
services:
  web:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    restart: unless-stopped
    labels:
      - "caddy=stockspotter.wavystack"
      - "caddy.reverse_proxy={{upstreams 3000}}"
      - "caddy.tls=internal"
    networks:
      - proxy

  # The realtime Rust WS backend (crates/ws-server) — see its Dockerfile for
  # why the build context has to be the repo root. Not exposed to the public
  # internet via caddy: this is a plain WebSocket (no TLS termination logic
  # of its own), so it's reached over the tailnet directly on its published
  # port rather than proxied through stockspotter.wavystack. Secrets come
  # from a .env file created directly on the Pi (see ops/pi/README.md) — the
  # dev machine's gitignored .env is never copied there.
  ws:
    build:
      context: .
      dockerfile: crates/ws-server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - WS_SERVER_ADDR=0.0.0.0:8787
      - HTTP_SERVER_ADDR=0.0.0.0:8788
    ports:
      - "8787:8787"
      # Historical-bars backfill endpoint (crates/ws-server/src/http.rs) —
      # same reasoning as 8787 above: reached directly over the tailnet,
      # not proxied through caddy.
      - "8788:8788"
    networks:
      - proxy

networks:
  proxy:
    external: true
