# Deployed on the Pi by deploy.sh (see stockspotter-deploy.timer). Joins the
# shared `proxy` network from the wavystack stack so caddy-docker-proxy
# auto-routes it — no manual Caddyfile editing.
services:
  web:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    restart: unless-stopped
    labels:
      - "caddy=stockspotter.wavystack"
      - "caddy.reverse_proxy={{upstreams 3000}}"
      - "caddy.tls=internal"
    networks:
      - proxy

  # The realtime Rust WS backend (crates/ws-server) — see its Dockerfile for
  # why the build context has to be the repo root. Secrets come from a .env
  # file created directly on the Pi (see ops/pi/README.md) — the dev
  # machine's gitignored .env is never copied there.
  #
  # Routed through caddy now, on its own two subdomains (caddy_0/caddy_1 —
  # caddy-docker-proxy's real, documented mechanism for multiple site
  # blocks off one container, same tls=internal cert scheme `web` already
  # uses, not a new one). Real bug this fixes, not just a cleanup: a plain
  # ws:// connection to a bare tailnet IP:port would still get blocked as
  # mixed content by any browser loading stockspotter.wavystack over
  # https:// — same-origin-family wss/https through caddy sidesteps that
  # entirely. apps/client/src/lib/config.ts is the client-side half (targets
  # these two hostnames whenever it isn't running against localhost).
  # 8787/8788 stay published too — harmless, kept for direct-tailnet/debug
  # access exactly as before, not required for the deployed site anymore.
  ws:
    build:
      context: .
      dockerfile: crates/ws-server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - WS_SERVER_ADDR=0.0.0.0:8787
      - HTTP_SERVER_ADDR=0.0.0.0:8788
      - QUALIFY_SERVICE_URL=http://qualify:8000
    ports:
      - "8787:8787"
      - "8788:8788"
    # Real host-persisted state (2026-09-03): the live detection-
    # efficiency benchmark (backtest_metrics::live_signals, wired in via
    # ws-server's own subscriber task) appends to data/live_pending_
    # signals.jsonl / data/live_evaluated_signals.jsonl using a plain
    # relative path -- without this mount that resolves to the
    # container's own ephemeral filesystem and gets wiped on every
    # redeploy, which would make a "real, continuously-accumulating
    # hit-rate" number pointless (most pending signals wouldn't survive
    # long enough to even reach their own evaluation window between
    # deploys). `/data` on the repo root is already gitignored (same
    # convention `backtest_log.jsonl` already uses locally) -- this just
    # makes that convention persist for the container too.
    volumes:
      - ./data:/app/data
    labels:
      - "caddy_0=ws.stockspotter.wavystack"
      - "caddy_0.reverse_proxy={{upstreams 8787}}"
      - "caddy_0.tls=internal"
      - "caddy_1=api.stockspotter.wavystack"
      - "caddy_1.reverse_proxy={{upstreams 8788}}"
      - "caddy_1.tls=internal"
    networks:
      - proxy
    depends_on:
      - qualify

  # Python qualitative layer (python/app) -- doc section 4.4's news
  # catalyst tagging. Internal-only: no published ports, no caddy labels
  # -- `ws` is its only caller, reaching it by service name over this same
  # `proxy` network (see live.rs's QUALIFY_SERVICE_URL / this file's `ws`
  # environment above). Same real ALPACA_* credentials as `ws`, from the
  # same untracked .env already on the Pi -- no separate secret to create.
  qualify:
    build:
      context: .
      dockerfile: python/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - proxy

networks:
  proxy:
    external: true
